<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · MercadoGestor</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container" style="max-width: 400px; margin-top: 12vh;">
    <h1 class="h3 text-success text-center mb-4">MercadoGestor</h1>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensagens %}<div class="alert alert-{{ categoria }}" role="alert">{{ texto }}</div>{% endfor %}
    {% endwith %}
    <div class="card shadow-sm"><div class="card-body">
      <form method="post" action="{{ url_for('auth.login') }}" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if proximo %}<input type="hidden" name="next" value="{{ proximo }}">{% endif %}
        <div class="mb-3">
          <label class="form-label" for="login">Login</label>
          <input type="text" class="form-control" id="login" name="login" value="{{ login }}"
                 autocomplete="username" autocapitalize="none" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="senha">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Entrar</button>
      </form>
    </div></div>
  </main>
</body>
</html>
