<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MercadoGestor{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-success px-3">
    <span class="navbar-brand mb-0 h1">MercadoGestor</span>
  </nav>

  <div class="d-flex">
    <aside class="sidebar bg-white border-end p-3">
      <ul class="nav nav-pills flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link {{ 'active' if request.endpoint == 'main.index' }}"
             href="{{ url_for('main.index') }}">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ 'active' if request.blueprint == 'categorias' }}"
             href="{{ url_for('categorias.lista') }}">Categorias</a>
        </li>
      </ul>
    </aside>

    <main class="flex-grow-1 p-4">
      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, texto in mensagens %}
          <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
            {{ texto }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
          </div>
        {% endfor %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
